<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Featured projects | Aaditi</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif&display=swap" rel="stylesheet">
  <style>
    body { margin: 0; background: #fbf1e6; font-family: "Instrument Serif", Georgia, serif; font-size: 20px; }
  </style>
</head>
<body>
  <div id="react-projects"></div>

  <script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone@7.24.7/babel.min.js"></script>

  <script type="text/babel">
    const { useState } = React;

    const projects = [
      { id: 1, title: "Portfolio gallery", description: "ProjectCard, ProjectList and a FilterBar that filters by tech with useState.", tech: ["React", "CSS"], github: "https://github.com/aadi-eee/week11", demo: "https://week11-rho.vercel.app/" },
      { id: 2, title: "Student directory", description: "A StudentProfileCard with five props, used for three students.", tech: ["React", "CSS"], github: "https://github.com/aadi-eee/week11-hw2", demo: "https://aadi-eee.github.io/week11-hw2/" },
      { id: 3, title: "Course catalog", description: "CourseCard components with a required badge, rendered from an array.", tech: ["React", "CSS"], github: "https://github.com/aadi-eee/course-catalog", demo: "https://aadi-eee.github.io/course-catalog/" },
      { id: 4, title: "Class practice", description: "Eight React exercises on components, props and rendering.", tech: ["React", "JavaScript"], github: "https://github.com/aadi-eee/class-practice", demo: "https://aadi-eee.github.io/class-practice/week11hmwrk.html" },
    ];

    const cardStyle = { background: "#fff", border: "2px solid #2a1b1b", borderRadius: 14, padding: 24, boxShadow: "6px 6px 0 #f4a6c4" };
    const tagStyle = { padding: "2px 10px", borderRadius: 999, background: "#fbeaa0", border: "1px solid #2a1b1b", fontSize: 14 };
    const linkStyle = { padding: "6px 14px", border: "2px solid #6b0f1a", borderRadius: 999, color: "#6b0f1a", textDecoration: "none" };
    const pillStyle = { padding: "8px 18px", border: "2px solid #2a1b1b", borderRadius: 999, background: "#fff", color: "#2a1b1b", cursor: "pointer", font: "inherit" };
    const pillActive = { background: "#6b0f1a", borderColor: "#6b0f1a", color: "#fff" };

    function ProjectCard({ title, description, tech, github, demo }) {
      return (
        <div style={cardStyle}>
          <h3 style={{ margin: "0 0 8px", color: "#6b0f1a", fontWeight: 400, fontSize: 28 }}>{title}</h3>
          <p style={{ margin: "0 0 12px" }}>{description}</p>
          <div style={{ display: "flex", flexWrap: "wrap", gap: 6, marginBottom: 14 }}>
            {tech.map((t) => <span key={t} style={tagStyle}>{t}</span>)}
          </div>
          <div style={{ display: "flex", gap: 12 }}>
            <a href={demo} target="_blank" rel="noreferrer" style={linkStyle}>Live site</a>
            <a href={github} target="_blank" rel="noreferrer" style={linkStyle}>Repository</a>
          </div>
        </div>
      );
    }

    function FilterBar({ techs, selected, onSelect }) {
      return (
        <div style={{ display: "flex", flexWrap: "wrap", gap: 10, marginBottom: 32 }}>
          {techs.map((t) => {
            const count = t === "All" ? projects.length : projects.filter((p) => p.tech.includes(t)).length;
            return (
              <button key={t} type="button" onClick={() => onSelect(t)}
                style={{ ...pillStyle, ...(t === selected ? pillActive : {}) }}>
                {t} ({count})
              </button>
            );
          })}
        </div>
      );
    }

    function Projects() {
      const [filter, setFilter] = useState("All");
      const techs = ["All", ...new Set(projects.flatMap((p) => p.tech))];
      const visible = filter === "All" ? projects : projects.filter((p) => p.tech.includes(filter));

      return (
        <section style={{ maxWidth: 1000, margin: "0 auto", padding: "40px 20px" }}>
          <h2 style={{ fontWeight: 400, fontSize: 52, color: "#2a1b1b", margin: "0 0 24px" }}>
            Featured <span style={{ color: "#6b0f1a", fontStyle: "italic" }}>projects</span>
          </h2>
          <FilterBar techs={techs} selected={filter} onSelect={setFilter} />
          <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fill, minmax(280px, 1fr))", gap: 24 }}>
            {visible.map((p) => <ProjectCard key={p.id} {...p} />)}
          </div>
        </section>
      );
    }

    ReactDOM.createRoot(document.getElementById("react-projects")).render(<Projects />);
  </script>
</body>
</html>
